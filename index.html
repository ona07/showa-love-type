<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>昭和ラブタイプ診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3E8D2; --surface:#FFFBF2; --ink:#231914; --soft:#5E4A3C; --line:#D9C6A5;
  --red:#B3261E; --redsoft:#F6DCD4; --teal:#1C6066; --tealsoft:#D3E8E6; --mid:#A8957E;
  --onaccent:#FFFBF2;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1411; --surface:#251D18; --ink:#F1E6D2; --soft:#C9B79F; --line:#43362C;
    --red:#F07563; --redsoft:#3D2420; --teal:#6DC0BC; --tealsoft:#1D3533; --mid:#7D6C5B;
    --onaccent:#1A1411;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1411; --surface:#251D18; --ink:#F1E6D2; --soft:#C9B79F; --line:#43362C;
  --red:#F07563; --redsoft:#3D2420; --teal:#6DC0BC; --tealsoft:#1D3533; --mid:#7D6C5B;
  --onaccent:#1A1411;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  font-size:17px;line-height:1.85;font-weight:500;
  -webkit-font-smoothing:antialiased;
}
.disp{font-family:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;font-weight:400;line-height:1.3;letter-spacing:.02em}
.wrap{max-width:720px;margin:0 auto;padding:16px 20px 72px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
[hidden]{display:none!important}

header.site{display:flex;justify-content:space-between;align-items:center;padding:8px 0 16px;margin-bottom:28px;border-bottom:2px solid var(--line)}
header.site a{color:var(--red);text-decoration:none;font-size:1.1rem}
.link{background:none;border:0;padding:6px 2px;color:var(--teal);font-weight:700;text-decoration:underline;text-underline-offset:5px}
.btn{
  background:var(--red);color:var(--onaccent);border:0;border-radius:999px;
  padding:15px 34px;font-weight:700;font-size:1.08rem;letter-spacing:.04em;
}
.btn:hover{filter:brightness(1.06)}
.btn.sub{background:transparent;color:var(--ink);border:2px solid var(--ink)}

/* start */
.hero-art{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 30px;border-radius:14px;overflow:hidden}
.hero-art svg{width:100%;height:auto;display:block}
h1{font-size:clamp(2.1rem,8vw,3.4rem);margin:0 0 14px;color:var(--ink)}
.lead{font-size:1.1rem;margin:0 0 26px;max-width:32em}
.facts{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 30px;padding:0;list-style:none}
.facts li{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:4px 14px;font-size:.95rem}
.actions{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.note{margin-top:34px;font-size:.9rem;color:var(--soft);line-height:1.7}

/* quiz */
.prog{display:flex;align-items:center;gap:14px;margin:0 0 34px}
.prog .track{flex:1;height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.prog .fill{height:100%;background:var(--red);border-radius:999px;transition:width .25s}
.prog span{font-size:.95rem;color:var(--soft);min-width:4.5em;text-align:right}
.qtext{font-size:clamp(1.35rem,4.6vw,1.75rem);margin:0 0 26px;font-weight:700;line-height:1.5}
.scale{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center}
.pole{border-radius:12px;padding:14px 16px;font-size:1.02rem;line-height:1.6;position:relative}
.pole b{display:block;font-size:.82rem;margin-bottom:4px;letter-spacing:.06em}
.pole.a{background:var(--redsoft)} .pole.a b{color:var(--red)}
.pole.b{background:var(--tealsoft)} .pole.b b{color:var(--teal)}
.dots{display:flex;gap:10px;align-items:center;justify-content:center}
.dot{border-radius:50%;background:var(--surface);border:3px solid var(--mid);padding:0;transition:background .12s,transform .12s}
.dot:hover{transform:scale(1.08)}
.dot[data-v="2"],.dot[data-v="1"]{border-color:var(--red)}
.dot[data-v="-1"],.dot[data-v="-2"]{border-color:var(--teal)}
.dot.on[data-v="2"],.dot.on[data-v="1"]{background:var(--red)}
.dot.on[data-v="0"]{background:var(--mid)}
.dot.on[data-v="-1"],.dot.on[data-v="-2"]{background:var(--teal)}
.dotcap{display:flex;justify-content:space-between;font-size:.82rem;color:var(--soft);margin-top:8px}
.qfoot{margin-top:30px}
@media (max-width:640px){
  .scale{grid-template-columns:1fr;gap:14px}
  .dots{gap:12px;padding:4px 0}
}

/* result */
.kicker{margin:0 0 10px;color:var(--soft);font-weight:700;text-align:center}
.portrait{max-width:340px;margin:0 auto;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.portrait svg{width:100%;height:auto;display:block}
.tname{text-align:center;font-size:clamp(2rem,8vw,2.9rem);margin:22px 0 4px;color:var(--red)}
.tcode{text-align:center;color:var(--soft);margin:0 0 26px;font-size:.95rem}
.block{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:22px 24px;margin:0 0 18px}
.block h3{margin:0 0 8px;font-size:1rem;color:var(--teal)}
.block p{margin:0}
.desc{font-size:1.08rem}
.meter{margin:0 0 16px}
.meter:last-child{margin:0}
.meter .lab{display:flex;justify-content:space-between;font-size:.92rem;gap:12px;line-height:1.5;margin-bottom:6px}
.meter .lab .w{font-weight:700;color:var(--ink)}
.meter .lab span{color:var(--soft)}
.meter .bar{height:12px;border-radius:999px;background:var(--tealsoft);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--red);border-radius:999px 0 0 999px}
.match{display:flex;align-items:center;gap:16px}
.match svg{width:76px;height:auto;border-radius:10px;flex:none}
.match button{background:none;border:0;padding:0;text-align:left;font-weight:700;font-size:1.1rem;color:var(--red);text-decoration:underline;text-underline-offset:5px}
.result-actions{margin-top:28px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.reveal{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none}.prog .fill{transition:none}}

/* gallery */
.gtitle{font-size:clamp(1.7rem,6vw,2.3rem);margin:0 0 6px}
.group{margin:30px 0 14px;font-size:1.1rem;color:var(--teal)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0;text-align:left;overflow:hidden;display:flex;flex-direction:column}
.card:hover{border-color:var(--red)}
.card svg{width:100%;height:auto;display:block}
.card strong{font-size:1rem;padding:10px 12px 2px;line-height:1.4}
.card small{padding:0 12px 14px;font-size:.86rem;line-height:1.6;color:var(--soft)}
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <a href="#" class="disp" id="home">昭和ラブタイプ診断</a>
    <button class="link" id="toTypes">16タイプ一覧</button>
  </header>
  <main>
    <section id="vStart">
      <div class="hero-art" id="heroArt" aria-hidden="true"></div>
      <h1 class="disp">あなたの恋、昭和で言うと何タイプ？</h1>
      <p class="lead">24の質問に5段階で答えると、あなたの恋のクセを昭和の16タイプに分けます。結果はちょっと失礼です。</p>
      <ul class="facts">
        <li>全24問</li><li>3分くらい</li><li>結果は16タイプ</li>
      </ul>
      <div class="actions">
        <button class="btn" id="start">診断をはじめる</button>
        <button class="link" id="startTypes">先に16タイプを見る</button>
      </div>
      <p class="note">タイプ名は昭和のイメージから付けたもので、性別は関係ありません。男性が「文学少女」、女性が「亭主関白」になることもあります。</p>
    </section>

    <section id="vQuiz" hidden>
      <div class="prog"><div class="track"><div class="fill" id="fill"></div></div><span id="count"></span></div>
      <h2 class="qtext" id="qtext" tabindex="-1"></h2>
      <div class="scale">
        <div class="pole a"><b>A</b><span id="pa"></span></div>
        <div>
          <div class="dots" id="dots" role="radiogroup" aria-label="どちらに近いか"></div>
          <div class="dotcap"><span>A寄り</span><span>B寄り</span></div>
        </div>
        <div class="pole b"><b>B</b><span id="pb"></span></div>
      </div>
      <div class="qfoot"><button class="link" id="back">ひとつ前の質問に戻る</button></div>
    </section>

    <section id="vResult" hidden></section>

    <section id="vTypes" hidden>
      <h2 class="gtitle disp">16タイプ一覧</h2>
      <p>気になるタイプを選ぶと、くわしい説明が見られます。</p>
      <h3 class="group">仕切りたい派</h3>
      <div class="grid" id="gridL"></div>
      <h3 class="group">任せたい派</h3>
      <div class="grid" id="gridR"></div>
    </section>
  </main>
</div>

const SCALE = [
  {v:2,s:52,l:'Aにとても近い'},{v:1,s:40,l:'Aにやや近い'},{v:0,s:30,l:'どちらとも言えない'},

function portrait(i, uid){
  const p = P[i], [top,bot,glow] = PAL[i], id = 'g'+uid;
  const face = p.mask
    ? `<ellipse cx="150" cy="150" rx="56" ry="64" fill="#F4F1E8" ${S()}/><ellipse cx="150" cy="168" rx="36" ry="38" fill="${p.sk}" ${S(3)}/>`
    : ears(p.sk) + headShape(p.sk);
  return `<svg viewBox="0 0 300 360" role="img" aria-label="${T[i].n}タイプの人物イラスト" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="${id}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient>
    <radialGradient id="${id}h" cx=".5" cy=".42" r=".5"><stop offset="0" stop-color="${glow}" stop-opacity=".95"/><stop offset=".55" stop-color="${glow}" stop-opacity=".35"/><stop offset="1" stop-color="${glow}" stop-opacity="0"/></radialGradient>
    <filter id="${id}f" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="${i+5}"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter>
  </defs>
  <rect width="300" height="360" fill="url(#${id}s)"/>
  <rect width="300" height="360" fill="url(#${id}h)"/>
  <g opacity=".22" stroke="${glow}" stroke-width="10" stroke-linecap="round" fill="none"><path d="M-10 60 Q80 46 160 58"/><path d="M180 34 Q250 26 310 38"/><path d="M-10 300 Q60 290 120 302"/></g>
  <g filter="url(#${id}f)">
    ${p.back}${p.out}${neck(p.sk)}${face}
    ${p.mask?'':BROWS[p.b]}${EYES[p.e]}${p.mask?'':NOSE}${MOUTH[p.m]}
    ${p.blush?BLUSH:''}${p.tear?TEAR:''}${p.front}${p.acc}
  </g>
</svg>`;
}

  const qi = ORDER[step], q = Q[qi];
  $('fill').style.width = (step/24*100) + '%';
  $('count').textContent = `${step+1} / 24`;
  $('qtext').textContent = q.t;
  $('pa').textContent = q.A; $('pb').textContent = q.B;
  document.querySelectorAll('.dot').forEach(d => {
    const on = answers[qi] !== null && +d.dataset.v === answers[qi];
    d.classList.toggle('on', on); d.setAttribute('aria-checked', on);
  });
  $('back').hidden = step === 0;
  show('vQuiz');
  $('qtext').focus({preventScroll:true});
}
function pick(v){
  if(lock) return;
  answers[ORDER[step]] = v;
  document.querySelectorAll('.dot').forEach(d => {
    const on = +d.dataset.v === v; d.classList.toggle('on', on); d.setAttribute('aria-checked', on);
  });
  lock = true;
  setTimeout(() => { lock = false; if(step < 23){ step++; renderQ(); } else finish(); }, 260);
}
function finish(){
  const sums = [0,0,0,0], first = [0,0,0,0];
  ORDER.forEach(qi => { const v = answers[qi] || 0, a = Q[qi].ax; sums[a] += v; if(!first[a] && v) first[a] = v; });
  const bits = sums.map((s,a) => s > 0 ? 0 : s < 0 ? 1 : (first[a] < 0 ? 1 : 0));
  const idx = bits[0]*8 + bits[1]*4 + bits[2]*2 + bits[3];
  last = {idx, sums};
  location.hash = 't' + (idx+1);
}
function sides(i){ return [i>>3&1,i>>2&1,i>>1&1,i&1].map((x,a)=> x ? AX[a].r : AX[a].l); }

function renderType(i){
  const t = T[i], mine = last && last.idx === i, m = t.m - 1;
  const meters = mine ? `<div class="block"><h3>あなたの傾き</h3>${AX.map((a,k)=>{
      const pl = Math.round((last.sums[k] + 12) / 24 * 100), leftWin = (i >> (3-k) & 1) === 0;
      return `<div class="meter"><div class="lab"><span class="${leftWin?'w':''}">${a.l} ${pl}%</span><span class="${leftWin?'':'w'}">${100-pl}% ${a.r}</span></div><div class="bar"><i style="width:${pl}%"></i></div></div>`;
    }).join('')}</div>` : '';
  $('vResult').innerHTML = `
    <p class="kicker">${mine ? 'あなたの診断結果' : 'タイプ紹介'}</p>
    <div class="portrait reveal">${portrait(i,'r')}</div>
    <h2 class="tname disp">${t.n}タイプ</h2>
    <p class="tcode">${sides(i).join('／')}</p>
    <div class="block"><p class="desc">${t.d}</p></div>
    <div class="block"><h3>恋のクセ</h3><p>${t.h}</p></div>
    ${meters}
    <div class="block"><h3>相性のいいタイプ</h3>
      <div class="match">${portrait(m,'m')}<div><button data-go="${t.m}">${T[m].n}タイプ</button><p style="font-size:.92rem;color:var(--soft);margin-top:4px">${T[m].s}</p></div></div>
    </div>
    <div class="result-actions">
      <button class="btn" data-act="retry">${mine ? 'もう一度診断する' : '診断してみる'}</button>
      <button class="btn sub" data-act="types">16タイプを見る</button>
    </div>`;
  show('vResult');
}

function renderGallery(){
  const card = i => `<button class="card" data-go="${i+1}">${portrait(i,'c'+i)}<strong>${T[i].n}タイプ</strong><small>${T[i].s}</small></button>`;
  $('gridL').innerHTML = [0,1,2,3,4,5,6,7].map(card).join('');
  $('gridR').innerHTML = [8,9,10,11,12,13,14,15].map(card).join('');
  $('heroArt').innerHTML = [0,4,9,14].map(i => portrait(i,'h'+i)).join('');
}
function startQuiz(){
  answers = new Array(24).fill(null); step = 0;
  if(location.hash) history.replaceState(null,'',location.pathname+location.search);
  renderQ();
}
function route(){
  const h = location.hash.slice(1), m = /^t(\d{1,2})$/.exec(h);
  if(m && +m[1]>=1 && +m[1]<=16){ renderType(+m[1]-1); return; }
  if(h === 'types'){ show('vTypes'); return; }
  show('vStart');
}

$('start').onclick = startQuiz;
$('back').onclick = () => { if(step>0 && !lock){ step--; renderQ(); } };
$('toTypes').onclick = $('startTypes').onclick = () => location.hash = 'types';
$('home').onclick = e => { e.preventDefault(); if(location.hash) location.hash = ''; else show('vStart'); };
$('dots').addEventListener('click', e => { const d = e.target.closest('.dot'); if(d) pick(+d.dataset.v); });
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]'); if(go){ location.hash = 't' + go.dataset.go; return; }
  const act = e.target.closest('[data-act]'); if(act){ act.dataset.act === 'retry' ? startQuiz() : (location.hash = 'types'); }
});
document.addEventListener('keydown', e => {
  if($('vQuiz').hidden) return;
  const map = {'1':2,'2':1,'3':0,'4':-1,'5':-2};
  if(e.key in map) pick(map[e.key]);
});
window.addEventListener('hashchange', route);
renderGallery();
route();
</script>
</body>
</html>
